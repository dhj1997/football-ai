[project]
name = "football-ai-api"
version = "0.1.0"
description = "Pre-match football analysis API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "SQLAlchemy>=2.0,<3",
  "PyMySQL>=1.1,<2",
  "uvicorn[standard]>=0.32,<1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "httpx>=0.27,<1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
