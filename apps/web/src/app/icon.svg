<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="pitchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="32" height="32" rx="8" fill="url(#pitchGrad)" />
  <!-- Pitch center circle & marks -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.35" />
  <line x1="16" y1="3" x2="16" y2="29" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.25" stroke-dasharray="2,2" />
  <line x1="3" y1="16" x2="29" y2="16" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.25" stroke-dasharray="2,2" />
  
  <!-- Compass dial marks -->
  <circle cx="16" cy="16" r="7" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-opacity="0.9" />
  
  <!-- Compass needle (North pointer) -->
  <polygon points="16,6 18.8,16 16,14 13.2,16" fill="#ffffff" />
  <!-- Compass needle (South pointer) -->
  <polygon points="16,26 18.8,16 16,18 13.2,16" fill="#044e3a" fill-opacity="0.75" />
  
  <!-- Center pivot -->
  <circle cx="16" cy="16" r="2" fill="#ffffff" />
  <circle cx="16" cy="16" r="1" fill="#0f766e" />
</svg>
